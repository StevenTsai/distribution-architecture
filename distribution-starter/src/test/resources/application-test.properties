# Test Environment - H2 内存数据库
spring.datasource.url=jdbc:h2:mem:distribution_starter_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.schema=classpath:sql/h2_schema.sql
spring.datasource.data=classpath:sql/h2_seed.sql

spring.redis.host=localhost
spring.redis.port=6379
app.redis.enabled=false

# 禁用定时任务
app.job.enabled=false
