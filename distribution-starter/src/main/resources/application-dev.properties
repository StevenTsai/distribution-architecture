# Dev Environment - 本地开发配置
# 请修改为你的本地 MySQL 连接信息
spring.datasource.url=jdbc:mysql://localhost:3306/distribution_starter?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_password_here

spring.redis.host=127.0.0.1
spring.redis.port=6379
spring.redis.password=
app.redis.enabled=false

# 仅开发环境提供 PII 默认密钥；生产环境缺失即启动失败（fail-fast）
app.pii.key=dev-only-change-me

# 开发环境开启接口文档
springdoc.api-docs.enabled=true

# Admin credentials (for local dev only, CHANGE BEFORE USE)
app.admin.username=admin
app.admin.password=CHANGE_ME_BEFORE_USE
