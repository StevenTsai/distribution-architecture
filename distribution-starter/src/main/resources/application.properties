# Distribution Starter
server.port=9030
spring.profiles.active=dev
app.api.role=ops
app.job.enabled=false

# PII 加密密钥（AES-256-GCM + HMAC 检索键）；默认为空触发 fail-fast，开发默认值见 application-dev.properties
app.pii.key=${PII_KEY:}

# CORS 允许来源（逗号分隔，支持通配模式）；禁止使用裸 * + allowCredentials 组合
app.cors.allowed-origins=http://localhost:*

# Tomcat
server.tomcat.accesslog.enabled=false

# MyBatis
mybatis.config-location=classpath:/mybatis-config.xml
mybatis.mapper-locations=classpath:/mapper/*.xml,classpath:/mapper/**/*.xml

# DataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Swagger（默认关闭，开发环境见 application-dev.properties）
springdoc.api-docs.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
